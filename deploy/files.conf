# nginx в контейнере prodclub-files: отдаёт фото кейсов и стили админки из томов.
# edge-caddy пересылает сюда /media/* и /static/* (см. deploy/prodclub.caddy)
server {
    listen 80;
    server_tokens off;

    # Имена фото = хеш содержимого, файл по одному адресу никогда не меняется
    location /media/ {
        alias /srv/media/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /static/ {
        alias /srv/static/;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        return 404;
    }
}
