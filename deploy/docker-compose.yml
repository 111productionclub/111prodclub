name: prodclub

# Порты наружу не публикуются: всё ходит через edge-caddy по сети web (см. deploy/README.md)

services:
  web:
    build:
      context: ../frontend
      args:
        # NEXT_PUBLIC_* вшивается в сборку: меняется только пересборкой (см. deploy/README.md)
        NEXT_PUBLIC_SHOP_ENABLED: ${NEXT_PUBLIC_SHOP_ENABLED:-}
    image: prodclub-web:latest
    container_name: prodclub-web
    restart: unless-stopped
    environment:
      # Next ходит в Django по внутренней сети
      API_URL: http://prodclub-api:8000
      # Пусто = фото берутся с того же домена (/media/ отдаёт prodclub-files)
      MEDIA_URL: ""
    networks: [internal, web]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    build: ../backend
    image: prodclub-api:latest
    container_name: prodclub-api
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             exec gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    environment:
      SECRET_KEY: ${DJANGO_SECRET_KEY:?впиши DJANGO_SECRET_KEY в deploy/.env}
      DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DOMAIN},www.${DOMAIN},prodclub-api,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${DOMAIN},https://www.${DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN},https://www.${DOMAIN}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-prodclub}
      POSTGRES_USER: ${POSTGRES_USER:-prodclub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?впиши POSTGRES_PASSWORD в deploy/.env}
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    networks: [internal, web]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/cases/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: postgres:17-alpine
    container_name: prodclub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prodclub}
      POSTGRES_USER: ${POSTGRES_USER:-prodclub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?впиши POSTGRES_PASSWORD в deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Только внутренняя сеть: из edge-caddy и других проектов база не видна
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  files:
    image: nginx:1.27-alpine
    container_name: prodclub-files
    restart: unless-stopped
    volumes:
      - ./files.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
      - static:/srv/static:ro
    networks: [web]

# Здесь лежат база и фото. Никогда не делай `docker compose down -v`: удалит их
volumes:
  pgdata: {}
  media: {}
  static: {}

networks:
  internal: {}
  web:
    external: true
